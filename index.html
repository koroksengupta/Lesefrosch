<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; media-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#eaf6ff">
<title>Lesefrosch</title>
<!--
  Lesefrosch – Vorschul-Lesetraining (Anlaute, Silbenschwingen, Silben lesen)
  Eine einzige Datei, keine Netzwerkanfragen, kein Login. Fortschritt nur im localStorage.
  Eigene Aufnahmen (optional): audio/<id>.mp3 neben diese Datei legen.
  Die IDs stehen im Elternbereich unter „Stimmtest".
-->
<style>
:root{
  --bg:#eaf6ff; --ink:#1d2b3a; --muted:#5b6b7b; --card:#fff; --shadow:#b9cfe0;
  --pond:#bfe3f2; --green:#3fa34d; --green-d:#2a7a35; --gold:#f5b700;
  --blue:#173a8c; --red:#c62828;           /* Zweifarben-Methode */
  --der:#1f5fbf; --die:#c9302c; --das:#2e8b3e; /* Artikel (nur Level 1) */
  --tap:72px;
  --font:'Lesefrosch Schrift','Andika','Andika New Basic','Comic Sans MS','Chalkboard SE','Century Gothic','Futura','Coming Soon',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;
  min-width:var(--tap);min-height:var(--tap);-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:4px dashed var(--blue);outline-offset:4px}
button:disabled{cursor:default}
svg{display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}

/* ---------- Menü ---------- */
#menu{align-items:center}
.brand{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:max(16px,3vh) 16px 0;text-align:center}
.brand-row{display:flex;align-items:center;gap:12px}
.brand-row svg.frog{width:min(14vmin,72px)}
.brand h1{margin:0;font-size:min(9vmin,52px);font-weight:700;color:var(--green-d);letter-spacing:.01em;line-height:1.1}
.brand .sub{margin-top:6px;font-size:min(4.2vmin,22px);color:var(--muted);font-weight:700}
.brand .sub b{color:var(--ink)}
.menu-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(5vmin,32px);padding:16px}
@media (orientation:landscape){.menu-wrap{flex-direction:row}}
.today{position:relative;width:min(64vmin,420px);height:min(50vmin,320px);border-radius:44px;
  background:linear-gradient(#78d985,#3fa34d);box-shadow:0 10px 0 var(--green-d);display:flex;align-items:center;justify-content:center;gap:4%}
.today{flex-direction:column;gap:2px}
.today .today-row{display:flex;align-items:center;justify-content:center;gap:8%;width:100%}
.today .frog{width:42%}
.today .today-lbl{color:#fff;font-weight:700;font-size:min(8vmin,44px);line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.today .play{width:22%;color:#fff;filter:drop-shadow(0 4px 0 rgba(0,0,0,.18))}
.today .play svg{width:100%;height:auto}
.today .tick{position:absolute;top:-14px;right:-14px;width:72px;height:72px;border-radius:50%;background:#fff;color:var(--green);
  display:none;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--shadow)}
.today.done .tick{display:flex}
.today.fresh{animation:pulse 2.4s ease-in-out infinite}
.side{display:grid;grid-template-columns:repeat(4,auto);gap:min(4vmin,22px)}
@media (orientation:landscape),(max-width:520px){.side{grid-template-columns:repeat(2,auto)}}
.lvl{width:min(20vmin,128px);height:min(20vmin,128px);min-width:84px;min-height:84px;border-radius:30px;background:#fff;
  box-shadow:0 7px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;overflow:hidden;font-weight:700}
.lvl:not(.bigicon){width:min(24vmin,140px);height:min(27vmin,156px);min-width:118px;min-height:128px}
.lvl .ico{display:flex;align-items:center;justify-content:center;gap:2px;min-height:48%;width:100%}
.lvl .lbl{font-size:min(3.8vmin,18px);line-height:1.15;text-align:center;color:var(--ink);font-family:var(--font)}
.bigicon .lbl{font-size:min(5vmin,28px)}
.lvl .mini-pic{font-size:min(5.5vmin,34px)}
.lvl .mini-letter{font-size:min(5.5vmin,34px)}
.lvl .mini-arrow{font-size:min(4vmin,22px);color:var(--muted)}
.lvl .mini-tile{display:inline-flex;align-items:center;justify-content:center;width:min(7.5vmin,44px);height:min(7.5vmin,44px);
  border-radius:10px;background:var(--bg);font-size:min(6vmin,34px)}
.lvl .mini-pond{display:flex;flex-direction:column;align-items:center;width:80%}
.lvl .mini-pond .frog{width:55%}
.lvl .mini-dots{display:flex;gap:6%;width:100%;justify-content:center}
.lvl .mini-dots i{width:26%;aspect-ratio:1.6;border-radius:50%;background:#7cc576}
.lvl svg.album{width:62%;height:auto}
.gate{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));width:64px;height:64px;min-width:64px;min-height:64px;
  border-radius:50%;color:#9fb3c6;display:flex;align-items:center;justify-content:center}
.gate svg.gear{width:34px;height:34px}
.gate svg.ring{position:absolute;inset:0;width:64px;height:64px;transform:rotate(-90deg)}
.gate svg.ring circle{fill:none;stroke:var(--blue);stroke-width:5;stroke-dasharray:176;stroke-dashoffset:176}
.gate.holding svg.ring circle{transition:stroke-dashoffset 3s linear;stroke-dashoffset:0}
.gate .warn{position:absolute;top:8px;right:8px;width:14px;height:14px;border-radius:50%;background:var(--red);display:none}
.gate.warnon .warn{display:block}

/* ---------- Spielfläche ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;flex:0 0 auto}
.icon-btn{width:var(--tap);height:var(--tap);border-radius:50%;background:#fff;box-shadow:0 5px 0 var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.icon-btn svg{width:40px;height:40px}
.icon-btn.press,.opt.press,.lvl.press,.tile.press,.go.press,.clap.press,.today.press,.ltile.press{transform:translateY(4px);box-shadow:none}
.pads{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;flex:1}
.pads i{width:28px;height:20px;border-radius:50%;background:#9fd3a6;opacity:.55;display:flex;align-items:center;justify-content:center}
.pads i.done{opacity:1;background:#7cc576}
.pads i svg{width:22px;height:22px}
#view{flex:1;display:flex;min-height:0;position:relative}
.l1,.l2,.l3,.intro,.trans{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:8px 16px 16px;gap:10px;min-height:0;min-width:0}
.cardpic{position:relative;width:min(46vmin,300px);height:min(46vmin,300px);background:#fff;border-radius:32px;box-shadow:0 7px 0 var(--shadow);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.cardpic .emo{font-size:min(30vmin,196px);line-height:1}
.cardpic svg{width:80%;height:80%}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.chip{position:absolute;top:-16px;left:-10px;box-shadow:0 3px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border-radius:999px;
  color:#fff;font-size:22px;font-weight:700;line-height:1}
.chip svg{width:18px;height:18px}
.chip.der{background:var(--der)} .chip.die{background:var(--die)} .chip.das{background:var(--das)}
.opts{display:flex;gap:min(4vmin,24px);flex-wrap:wrap;justify-content:center;align-items:center}
.opt{position:relative;min-width:min(26vmin,170px);height:min(21vmin,128px);min-height:84px;padding:0 18px;font-size:min(12vmin,80px);font-weight:700;
  background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--shadow);line-height:1;transition:opacity .25s}
.opt.ok{background:#e3f6e5;box-shadow:0 7px 0 var(--green);outline:5px solid var(--green)}
.opt.no{opacity:.35}
.opt.hint,.hintglow{outline:7px solid var(--gold);animation:pulse 1s ease-in-out infinite}
.mark{position:absolute;top:-14px;right:-14px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
.mark.ok{background:var(--green)} .mark.no{background:#6b7785}
.mark svg{width:28px;height:28px}
.hand{position:absolute;left:50%;bottom:-40px;transform:translateX(-50%);font-size:48px;pointer-events:none;animation:nudge 1s ease-in-out infinite}
.shake{animation:shake .5s}
@media (orientation:landscape){
  .l1{flex-direction:row}
  .l1 .opts{flex-direction:column;flex-wrap:nowrap}
  .l1 .opt{height:min(19vh,118px)}
}

/* Level 2 */
.l2 .cardpic{width:min(34vmin,230px);height:min(34vmin,230px)}
.l2 .cardpic .emo{font-size:min(22vmin,150px)}
.wordline{min-height:min(15vmin,96px);display:flex;align-items:flex-end;justify-content:center;font-size:min(12vmin,78px);font-weight:700;line-height:1.1}
.s{position:relative;display:inline-block;padding:0 .03em .3em;transition:transform .2s}
.s::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:.24em;border:.07em solid currentColor;border-top:0;border-radius:0 0 999px 999px}
.s.b{color:var(--blue)} .s.r{color:var(--red)}
.s.lit{transform:translateY(-8px) scale(1.12)}
.pond{display:flex;align-items:flex-end;justify-content:space-between;gap:min(2vmin,14px);padding:14px 18px;background:var(--pond);border-radius:999px;width:min(94vw,620px)}
.pond.shake{animation:shake .5s}
.bank,.pad{position:relative;flex:1;max-width:110px;height:min(10vmin,62px);min-height:44px;display:flex;align-items:flex-end;justify-content:center}
.bank{background:#d6b98c;border-radius:40% 40% 18% 18%}
.pad{background:radial-gradient(ellipse at 50% 55%,#86cf7f 58%,#4f9d4a 60%);border-radius:50%}
.pad.dim{opacity:.18}
.pad.mark2{outline:4px dashed var(--gold);outline-offset:3px}
.hopper{position:absolute;bottom:35%;width:88%;max-width:84px;pointer-events:none}
.hopper.hop{animation:hop .38s ease-out}
.ctrls{display:flex;gap:min(6vmin,36px);align-items:center;justify-content:center}
.clap{width:min(28vmin,150px);height:min(28vmin,150px);border-radius:50%;background:#ffb74d;box-shadow:0 8px 0 #e08a00;font-size:min(14vmin,70px)}
.okbtn{width:96px;height:96px;border-radius:50%;background:var(--green);color:#fff;box-shadow:0 6px 0 var(--green-d);display:flex;align-items:center;justify-content:center}
.okbtn svg{width:56px;height:56px}
@media (orientation:landscape) and (max-height:620px){
  .l2{display:grid;grid-template-columns:1fr 1.3fr;grid-template-rows:auto auto;align-items:center;justify-items:center}
  .l2 .cardpic{grid-row:1;grid-column:1}
  .l2 .wordline{grid-row:2;grid-column:1}
  .l2 .pond{grid-row:1;grid-column:2;width:100%}
  .l2 .ctrls{grid-row:2;grid-column:2}
}

/* Level 3 */
.build{display:flex;gap:min(10vmin,64px);align-items:center;justify-content:center;min-height:min(32vmin,200px)}
.tile{position:relative;min-width:min(28vmin,170px);height:min(32vmin,196px);padding:0 14px;font-size:min(16vmin,104px);font-weight:700;background:#fff;
  border-radius:28px;box-shadow:0 8px 0 var(--shadow);transition:transform .55s ease,box-shadow .2s;line-height:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .anc{width:min(9vmin,52px);height:min(9vmin,52px);display:flex;align-items:center;justify-content:center;
  font-size:min(7vmin,40px);transition:transform .3s;transform-origin:50% 0}
.tile .anc svg{width:100%;height:100%}
.tile.lit .anc{transform:scale(1.7)}
.tile.next{outline:6px solid var(--gold);animation:pulse 1.2s ease-in-out infinite}
.tile.used{box-shadow:0 8px 0 #9fd3a6}
.tile .s{font-size:.8em}
.merged{display:flex;align-items:flex-end;justify-content:center;min-height:min(28vmin,170px);padding:0 30px 10px;font-size:min(19vmin,120px);font-weight:700;background:#fff;
  border-radius:28px;box-shadow:0 8px 0 var(--shadow);animation:pop .45s ease-out;line-height:1}
.merged .s{font-size:1em}
.plain{color:var(--ink)}
.readalong{width:72px;height:72px;animation:pulse 1s ease-in-out infinite}
.stage3{display:flex;flex-direction:column;align-items:center;gap:10px}
.reward{min-height:min(18vmin,110px);display:flex;align-items:center;justify-content:center}
.reward .emo{font-size:min(16vmin,100px);animation:pop .5s ease-out}
.reward svg{width:min(18vmin,110px);height:min(18vmin,110px);animation:pop .5s ease-out}
.check .opt{font-size:min(10vmin,66px)}

/* Intro / Übergang */
.letters{display:flex;flex-wrap:wrap;gap:min(3vmin,18px);justify-content:center}
.ltile{position:relative;width:min(24vmin,150px);height:min(30vmin,186px);min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  background:#fff;border-radius:26px;box-shadow:0 7px 0 var(--shadow);transition:transform .2s}
.ltile .L{font-size:min(11vmin,70px);font-weight:700;line-height:1}
.ltile .p{font-size:min(9vmin,54px);width:min(12vmin,70px);height:min(10vmin,62px);display:flex;align-items:center;justify-content:center}
.ltile .p svg{width:100%;height:100%}
.ltile.lit{outline:6px solid var(--gold);transform:scale(1.06)}
.vs{display:flex;align-items:center;gap:min(3vmin,18px)}
.vs .ear{width:min(12vmin,70px);color:var(--muted)}
.go{width:min(28vmin,150px);height:min(28vmin,150px);border-radius:50%;background:var(--green);color:#fff;box-shadow:0 8px 0 var(--green-d);
  display:flex;align-items:center;justify-content:center}
.go svg{width:55%;height:55%}
.go.ready{animation:pulse 1.2s ease-in-out infinite}
.bigfrog{width:min(42vmin,260px)}
svg.frog{height:auto}
.hopper svg{width:100%}
.bigicon .mini-pic,.bigicon .mini-letter{font-size:min(10vmin,60px)}
.bigicon .mini-tile{width:min(11vmin,66px);height:min(11vmin,66px);font-size:min(9vmin,50px)}
.bigicon{width:min(34vmin,200px);height:min(34vmin,200px);min-width:0;min-height:0;pointer-events:none}
.stars{display:flex;gap:10px}
.stars svg{width:min(12vmin,64px);height:min(12vmin,64px)}

/* Effekte */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.flystar{position:absolute;width:90px;height:90px;animation:starfly 1s ease-out forwards}
.conf{position:absolute;top:-20px;width:14px;height:20px;border-radius:3px;animation:fall 2.2s linear forwards}
.stickerbig{font-size:min(38vmin,230px);animation:pop .7s ease-out;line-height:1}

/* Album */
.album-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:16px;padding:12px 16px 24px;align-content:start}
.slot{aspect-ratio:1;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 5px 0 var(--shadow)}
.slot.empty{background:transparent;box-shadow:none;border:4px dashed var(--shadow)}
.slot.gold{outline:5px solid var(--gold)}
.slot.new{animation:pop .6s ease-out,pulse 1.2s .6s ease-in-out 3}

/* Elternbereich */
#parent{overflow:auto;display:none;background:#f7fafc;-webkit-user-select:text;user-select:text;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
#parent.on{display:block}
.pp{max-width:880px;margin:0 auto;padding:16px 16px 60px}
.pp h1{font-size:24px;margin:8px 0 4px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pp h2{font-size:19px;margin:26px 0 8px;border-bottom:2px solid #dde6ee;padding-bottom:4px}
.pp .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.pp button{min-width:0;min-height:48px;padding:8px 14px;border-radius:10px;background:#fff;border:2px solid #b9cfe0;font-family:inherit}
.pp button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.pp button.danger{border-color:var(--red);color:var(--red)}
.pp select,.pp input[type=range]{min-height:44px;font-size:16px}
.pp label{display:inline-flex;gap:8px;align-items:center;min-height:44px}
.pp input[type=checkbox]{width:24px;height:24px}
.pp .note{background:#fff7e0;border:2px solid #f5d27a;border-radius:10px;padding:10px 12px;margin:8px 0}
.pp .note.bad{background:#fdecec;border-color:#e8a1a1}
.pp .note.good{background:#e9f7ec;border-color:#9fd3a6}
.pp table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
.pp th,.pp td{border:1px solid #dde6ee;padding:4px 6px;text-align:left;vertical-align:top}
.pp th{background:#eef3f8}
.pp .scroll{overflow:auto;max-height:420px;border:1px solid #dde6ee;border-radius:8px}
.pp code{background:#eef3f8;padding:1px 4px;border-radius:4px}
.pp tr.playing{background:#fff3c4}
.pp .okc{color:var(--green-d);font-weight:700} .pp .badc{color:var(--red);font-weight:700}
.pp details{margin:8px 0}

@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes nudge{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-10px)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-55%)}100%{transform:translateY(0)}}
@keyframes starfly{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}100%{transform:translate(-50%,-190%) scale(.6);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:1ms!important}
  .conf{display:none}
}
</style>
<style>

function migrate(o){
  const d=defaults();
  if(!o || typeof o!=='object' || o.v!==1) return d;
  const r=Object.assign(d, o);
  r.settings = Object.assign(defaults().settings, o.settings||{});

function tone(f, t0, dur, vol, type){
  const a=ac(); if(!a || S.settings.mute) return;
  const o=a.createOscillator(), g=a.createGain(); const t=a.currentTime+t0;

}

function playFile(id, tok){

    let done=false, started=false;
    const fin=ok=>{ if(done) return; done=true; clearTimeout(t1); clearTimeout(t2); if(curAudio===a) curAudio=null; res(ok); };
    const t1=setTimeout(()=>{ if(!started){ try{a.pause();}catch(e){} fin(false); } }, 1500);
    let t2=null;

async function say(parts){
  stopSpeech(); const tok=sayTok;
  await new Promise(r=>setTimeout(r,30));

    if(tok!==sayTok) return false;
    if(p==null) continue;
    if(typeof p==='number'){ await new Promise(r=>setTimeout(r,p*SPEED)); continue; }
    let played=false;
    if(p.id) played = await playFile(p.id, tok);
    if(tok!==sayTok) return false;
    if(!played && p.t) await tts(p.t, p.r);
  }
  return tok===sayTok;
}

/* ========================= Runden-Auswahl ========================= */
function st(id){ return S.items[id] || { seen:0, misses:0, hints:0, last:'' }; }
function priority(it){ const s=st(it.id); return s.last==='hint'?2 : s.last==='miss'?1 : 0; }
function weight(it){ const s=st(it.id); return 1 + 3*priority(it) + Math.min(s.misses + 2*s.hints, 6)*0.5; }
function weightedSample(pool, k){
  const a=pool.slice(), out=[];
  while(out.length<k && a.length){
    const tot=a.reduce((x,it)=>x+weight(it),0); let r=Math.random()*tot, i=0;
    for(;i<a.length-1;i++){ r-=weight(a[i]); if(r<=0) break; }
    out.push(a.splice(i,1)[0]);
  }
  return out;
}
/* Wiederholungs-Item: zuerst verpasste/mit Hilfe gelöste Items, sonst zufällig */
function pickReview(pool){
  if(!pool.length) return null;
  const top=Math.max(...pool.map(priority));
  return pick(top>0 ? pool.filter(p=>priority(p)===top) : pool);
}
function leastSeen(pool, k, pref){
  return shuffle(pool).sort((a,b)=> (st(a.id).seen-st(b.id).seen) || ((pref?pref(b):0)-(pref?pref(a):0))).slice(0,k);
}
function l1Cands(target, mi){
  const all=[...lettersUpTo(mi)].filter(l=>l!==target && !isPair(CONFUSABLE,l,target));
  const soft=all.filter(l=>!isPair(SIMILAR,l,target));
  return soft.length>=2 ? soft : all;
}
function l1Options(target, mi, avoidKey, contrastWith){
  const learned=[...lettersUpTo(mi)];
  let cands=l1Cands(target, mi);
  let fixed=[], n=2;
  if(contrastWith && learned.includes(contrastWith)){ fixed=[contrastWith]; n=1; cands=cands.filter(l=>l!==contrastWith); }
  let best=null;
  for(let t=0;t<16;t++){ const c=fixed.concat(shuffle(cands).slice(0,n)); best=c; if(!avoidKey || c.slice().sort().join('')!==avoidKey) break; }
  return shuffle([target].concat(best));
}
function l3Distractor(it, mi, avoidText){
  const pool=l3Pool(mi).filter(x=>x.kind===it.kind && x.text!==it.text && x.text!==avoidText);
  let pref=[];
  if(it.kind==='syl'){
    const C=it.text[0], V=it.text.slice(1);
    if(it.contrastWith){ const c=pool.find(x=>x.text===it.contrastWith+V); if(c) return c.text; }
    pref=pool.filter(x=>x.text[0]===C);
    if(!pref.length) pref=pool.filter(x=>x.text.slice(1)===V && !isPair(CONFUSABLE,x.text[0],C) && !isPair(SIMILAR,x.text[0],C));
  } else {
    const low=it.parts.map(p=>p.toLowerCase());
    pref=pool.filter(x=>x.parts.some(p=>low.includes(p.toLowerCase())));
  }
  const src=pref.length?pref:pool; return src.length ? pick(src).text : null;
}
function prepare(it, mi, avoid){
  if(it.level===1){ it.target=it.w.first; it.opts=l1Options(it.target, mi, avoid, it.contrastWith); }
  if(it.level===3){ const d=l3Distractor(it, mi, avoid); it.check = d ? shuffle([it.text, d]) : null; }
  return it;
}
const optKey = it => it.level===1 ? it.opts.filter(l=>l!==it.target).sort().join('') : (it.check||[]).find(x=>x!==it.text);

function orderItems(items, level){
  if(level===1){
    const a=shuffle(items); const t=a.findIndex(x=>x.twin);
    if(t>=0){ const o=a.findIndex(x=>!x.twin && x.id===a[t].id);
      if(Math.abs(t-o)===1){ const tw=a.splice(t,1)[0]; const o2=a.findIndex(x=>!x.twin && x.id===tw.id); a.splice(o2>=2?0:a.length,0,tw); } }
    return a;
  }
  if(level===2){
    const tw=items.filter(x=>x.twin), rest=items.filter(x=>!x.twin);
    const a=shuffle(rest).sort((x,y)=>x.w.syl.length-y.w.syl.length);
    if(tw.length && a.length>1 && a[a.length-1].id===tw[0].id){
      for(let j=a.length-2;j>=0;j--) if(a[j].w.syl.length===a[a.length-1].w.syl.length){ const t=a[j]; a[j]=a[a.length-1]; a[a.length-1]=t; break; }
    }
    return a.concat(tw);
  }
  const s=shuffle(items.filter(x=>x.kind==='syl')), w=shuffle(items.filter(x=>x.kind!=='syl'));
  return s.concat(w);
}
/* Eine Runde = genau 5 Items: 4 neu + 1 Wiederholung (20 %) aus dem vorherigen Modul */
function buildRound(mi, level){
  const m=MODS[mi]; let items;
  if(m.review){
    const pool=[]; contentBefore(mi).forEach(j=>pool.push(...itemsOf(j,level)));
    items=weightedSample(pool,5).map(x=>Object.assign({},x,{isReview:true}));
  } else {
    const all=itemsOf(mi,level); let fresh;
    if(level===3){
      const words=all.filter(x=>x.kind==='word'), syls=all.filter(x=>x.kind==='syl');
      const nw=Math.min(2,words.length), newL=new Set(m.letters);
      fresh=leastSeen(syls,4-nw,x=>newL.has(x.text[0])?1:0).concat(leastSeen(words,nw));
      if(fresh.length<4) fresh=fresh.concat(leastSeen(all.filter(x=>!fresh.includes(x)),4-fresh.length));
    } else fresh=leastSeen(all,4);
    fresh=fresh.map(x=>Object.assign({},x,{isReview:false}));
    const pj=prevContent(mi); let extra=null;
    if(pj<0){ /* Modul 1: 5. Item aus eigenem Stoff */
      const rest=all.filter(x=>!fresh.some(f=>f.id===x.id));
      if(rest.length) extra=Object.assign({},leastSeen(rest,1)[0],{isReview:false,fill:true});
      else {
        let src=fresh;
        if(level===2){ const mx=Math.max(...fresh.map(x=>x.w.syl.length)); src=fresh.filter(x=>x.w.syl.length===mx); }
        if(level===1){ const f=fresh.filter(x=>l1Cands(x.w.first,mi).length>=3); if(f.length) src=f; }  /* andere Ablenker möglich */
        extra=Object.assign({},pick(src),{isReview:false,twin:true});
      }
    } else {
      const r=pickReview(itemsOf(pj,level)); if(r) extra=Object.assign({},r,{isReview:true});
    }
    items=extra?fresh.concat([extra]):fresh;
  }
  items=orderItems(items, level);
  /* bewusster Kontrast (z. B. D/T) beim ersten Item des neuen Buchstabens */
  if(!m.review) m.contrast.forEach(pr=>{
    const nw=pr[0], old=pr[1];
    const f = level===1 ? items.find(x=>x.w.first===nw) : level===3 ? items.find(x=>x.kind==='syl' && x.text[0]===nw) : null;
    if(f) f.contrastWith=old;
  });
  items.forEach(it=>{ if(!it.twin) prepare(it, mi); });
  items.forEach(it=>{ if(it.twin){ const o=items.find(x=>!x.twin && x.id===it.id); prepare(it, mi, o?optKey(o):null); } });
  return items;
}
function warmItems(fromMi){
  const pool = lv => MODS[fromMi].review ? contentBefore(fromMi).flatMap(j=>itemsOf(j,lv)) : itemsOf(fromMi,lv);
  const r=[].concat(weightedSample(pool(1),2), weightedSample(pool(2),1), weightedSample(pool(3),2))
    .map(x=>Object.assign({},x,{isReview:false,warm:true}));
  r.forEach(it=>prepare(it, S.cur));
  return r;
}

/* ========================= Tagesplanung ========================= */
/* Freischalten: Modul abgeschlossen UND anderes Kalenderdatum. Datum wird nur auf Ungleichheit
   geprüft, nie auf „kleiner" – eine zurückgestellte Uhr sperrt nichts und löscht nichts. */
function planHeute(today){
  const ss=S.session;
  if(ss && !ss.finished && (ss.date===today || dayDiff(today, ss.date)>0) && ss.m===S.cur) return ss;  /* fortsetzen */
  const prevMode = ss && ss.m===S.cur && ss.mode!=='extra' ? ss.mode : null;
  S.session=null;
  let mode=prevMode||'new', m=S.cur;
  const ld=S.lastDone;
  if(S.pending){
    if(ld && today===ld.date){ mode='extra'; }
    else {
      if(S.repeat) mode='repeat';
      else if(S.cur < MODS.length-1){ S.cur++; mode='new'; }
      else mode='repeat';
      m=S.cur; S.pending=false; S.repeat=false; S.repeatWhy='';
    }
  }
  const warm = mode!=='extra' && ld && dayDiff(ld.date, today)>3;
  const steps=[];
  if(mode!=='extra') steps.push('intro');
  if(warm) steps.push('warm');
  steps.push('L1','L2','L3', mode==='extra'?'done':'sticker');
  S.session={ m, mode, date:today, warmFrom: warm?ld.m:null, steps, idx:0, revHints:0, revTotal:0 };
  save();
  return S.session;
}
function completeSession(today){
  const s=S.session; if(!s) return;
  let fail = s.revTotal>0 && s.revHints*2 > s.revTotal;
  /* Nie festhängen: nach 2 Wiederholungen desselben Tages geht es trotzdem weiter (Eltern sehen den Hinweis). */
  const reps = (()=>{ let n=0; for(let k=S.sessions.length-1;k>=0 && S.sessions[k].m===s.m && S.sessions[k].mode==='repeat';k--) n++; return n; })() + (s.mode==='repeat'?1:0);
  const capped = fail && reps>=2;
  if(capped) fail=false;
  S.sessions.push({ m:s.m, date:today, mode:s.mode, warm:s.warmFrom!=null, revHints:s.revHints, revTotal:s.revTotal, repeatNext:fail, capped });
  if(S.sessions.length>400) S.sessions=S.sessions.slice(-400);
  S.lastDone={ m:s.m, date:today }; S.lastDate=today; S.cur=s.m;
  S.pending=true; S.repeat=fail;
  S.repeatWhy = fail ? `Bei ${s.revHints} von ${s.revTotal} Wiederholungsaufgaben war ein Hinweis nötig (mehr als die Hälfte).` : '';
  S.note = capped ? `Tag ${s.m+1} wurde schon zweimal wiederholt und es gab weiter viele Hinweise – es geht trotzdem weiter, damit das Kind motiviert bleibt. Bitte die Ergebnisse unten ansehen und evtl. gemeinsam üben oder „Diesen Tag wiederholen" wählen.` : '';
  S.stickers.push({ s:STICKERS[S.stickers.length % STICKERS.length], m:s.m, date:today, review:MODS[s.m].review });
  S.session=null; save();
}
function record(it, out){
  const s=S.items[it.id] || (S.items[it.id]={seen:0,misses:0,hints:0,last:''});
  s.seen++; s.misses+=out.misses; if(out.hinted) s.hints++;
  if(!it.requeued) s.last = out.hinted?'hint' : out.misses?'miss' : 'ok';
  s.d=todayStr(); save();
}

/* ---------- Level 1: Anlaut ---------- */
async function playL1(it, c){
  const run=c.run, w=it.w;
  view().innerHTML = `<div class="l1"><div class="cardpic">${picHTML(w.pic)}${artChip(w.art)}</div>
    <div class="opts">${it.opts.map(l=>`<button class="opt" data-l="${l}" aria-label="${LetterPair(l)}">${LetterPair(l)}</button>`).join('')}</div></div>`;
  const prompt = () => [W(w), 350, LAUT(w.first), 250, Wslow(w)];
  REPLAY = () => sayBg(prompt());
  sayBg(c.intro ? [TXT.l1, 300].concat(prompt()) : prompt());
  let misses=0, hinted=false;
  for(;;){
    const b = await waitTap(x=>x.classList.contains('opt') && !x.disabled && x.closest('.l1'), run);
    stopSpeech();
    if(b.dataset.l===it.target){
      $$('.l1 .opt').forEach(x=>{ x.disabled=true; x.classList.remove('hint'); }); const h=$('.hand'); if(h) h.remove();
      b.classList.add('ok'); mark(b,true); chime(); flyStar(b);
      await speak([hinted?PRAISE[4]:pick(PRAISE), 150, W(w)], run);
      await wait(350, run);
      return { misses, hinted };
    }
    if(hinted) continue;
    misses++; shake(b); b.disabled=true; b.classList.add('no'); mark(b,false);
    if(misses>=2){
      hinted=true;
      const ok=$(`.l1 .opt[data-l="${it.target}"]`); ok.classList.add('hint'); ok.insertAdjacentHTML('beforeend','<span class="hand emo">👆</span>');
      REPLAY = () => sayBg([W(w), 250, LAUT(w.first)]);
      sayBg([TXT.look, 200, W(w), 250, LAUT(w.first)]);
    } else sayBg([TXT.again, 250].concat(prompt()));
  }
}

/* ---------- Level 2: Silbenschwingen ---------- */
const MAXPADS = Math.max(4, ...MODS.flatMap(m=>m.words.map(w=>w.syl.length+1)));
async function playL2(it, c){
  const run=c.run, w=it.w, n=w.syl.length;
  view().innerHTML = `<div class="l2"><div class="cardpic">${picHTML(w.pic)}</div>
    <div class="wordline" aria-hidden="true"></div>
    <div class="pond"><div class="bank"><span class="hopper">${ICON.frog}</span></div>${'<div class="pad"></div>'.repeat(MAXPADS)}</div>
    <div class="ctrls"><button class="icon-btn reset" aria-label="Von vorn">${ICON.reset}</button>
      <button class="clap emo" aria-label="Klatschen">👏</button>
      <button class="okbtn" aria-label="Fertig">${ICON.check}</button></div></div>`;
  const pond=$('.pond'), pads=$$('.pad'), bank=$('.bank'), frog=$('.hopper');
  let hops=0, misses=0, hinted=false;
  const hopTo = k => { const tgt = k<=0 ? bank : pads[Math.min(k,pads.length)-1]; tgt.appendChild(frog);
    frog.classList.remove('hop'); void frog.offsetWidth; frog.classList.add('hop'); };
  const slow = () => [{ id:w.id+'-silben', t:w.text, r:0.62 }];
  REPLAY = () => sayBg(slow());
  sayBg(c.intro ? [TXT.l2, 300].concat(slow()) : slow());
  const demo = async (lit) => {
    hopTo(0); await wait(300, run);
    sayBg([{ id:w.id+'-silben', t:w.text, r:0.62 }]);
    for(let k=1;k<=n;k++){ await wait(k===1?250:520, run); hopTo(k); tock();
      if(lit){ $$('.wordline .s').forEach((s,i)=>s.classList.toggle('lit', i===k-1)); } }
    await wait(700, run); $$('.wordline .s').forEach(s=>s.classList.remove('lit'));
  };
  for(;;){
    const b = await waitTap(x=>!!x.closest('.l2 .ctrls'), run);
    if(b.classList.contains('clap')){ hops++; tock(); hopTo(hops); continue; }
    if(b.classList.contains('reset')){ hops=0; hopTo(0); continue; }
    if(hops===0){ shake($('.clap')); continue; }
    stopSpeech();
    if(hops===n){
      $$('.l2 .ctrls button').forEach(x=>x.disabled=true);
      chime(); flyStar($('.okbtn'));
      $('.wordline').innerHTML = sylHTML(w.syl);
      await speak([pick(PRAISE)], run);
      await demo(true);
      await speak([W(w)], run);
      await wait(300, run);
      return { misses, hinted };
    }
    if(!hinted) misses++;
    shake(pond); hops=0; hopTo(0);
    if(misses>=2 && !hinted){
      hinted=true;
      pads.forEach((p,i)=>{ p.classList.toggle('dim', i>=n); p.classList.toggle('mark2', i<n); });
      $$('.l2 .ctrls button').forEach(x=>x.disabled=true);
      await speak([TXT.look], run);
      await demo(false);
      hopTo(0);
      $$('.l2 .ctrls button').forEach(x=>x.disabled=false);
      REPLAY = () => sayBg(slow());
      sayBg([TXT.you]);
    } else if(hinted){
      await demo(false); hopTo(0);
    } else sayBg([TXT.again, 250].concat(slow()));
  }
}

/* ---------- Level 3: Silben lesen (Verschleifen) ---------- */
function tileHTML(it, i){
  if(it.kind==='syl'){
    const L=it.parts[i], a=ANCHOR[L.toUpperCase()];
    return `<button class="tile" data-i="${i}" aria-label="${esc(L)}">${esc(L)}<span class="anc">${a?picHTML(a.pic):''}</span></button>`;
  }
  return `<button class="tile" data-i="${i}" aria-label="${esc(it.parts[i])}"><span class="s ${i%2?'r':'b'}">${esc(it.parts[i])}</span></button>`;
}
function tileSound(it, i){
  if(it.kind==='syl'){ const L=it.parts[i].toUpperCase(), a=ANCHOR[L]; return [LAUT(L), a?W(a):null]; }
  return [SYL(it.parts[i])];
}
async function playL3(it, c){
  const run=c.run, isSyl=it.kind==='syl';
  const unit = () => isSyl ? SYL(it.text) : RW(it);
  view().innerHTML = `<div class="l3"><div class="stage3"><div class="build">${it.parts.map((_,i)=>tileHTML(it,i)).join('')}</div>
    <div class="reward"></div></div><div class="check opts"></div></div>`;
  const tiles=$$('.build .tile');
  const intro = isSyl ? TXT.l3 : TXT.l3w;
  REPLAY = () => sayBg([intro]);
  if(c.intro) sayBg([intro]);
  /* von links nach rechts antippen */
  for(let i=0;i<tiles.length;i++){
    tiles[i].classList.add('next');
    for(;;){
      const b = await waitTap(x=>x.classList.contains('tile') && !!x.closest('.build'), run);
      const bi=+b.dataset.i;
      if(bi===i){ break; }
      if(bi<i){ sayBg(tileSound(it,bi)); lit(tiles[bi]); continue; }
      shake(tiles[i]);
    }
    tiles[i].classList.remove('next'); tiles[i].classList.add('used'); lit(tiles[i]);
    await speak(tileSound(it,i), run);
  }
  /* zusammenschieben */
  await wait(200, run);
  const r0=tiles[0].getBoundingClientRect(), r1=tiles[tiles.length-1].getBoundingClientRect();
  const gap=(r1.left - r0.right)/2;
  tiles[0].style.transform=`translateX(${gap}px)`; tiles[tiles.length-1].style.transform=`translateX(${-gap}px)`;
  await wait(reducedMotion()?50:600, run);
  const build=$('.build');
  build.innerHTML = `<button class="merged" aria-label="${esc(it.text)}">${isSyl ? `<span class="s b">${esc(it.text)}</span>` : sylHTML(it.parts)}</button>`;
  build.insertAdjacentHTML('beforeend', ICON.mouth);
  $('.merged')._fn = () => sayBg([unit()]);
  await wait(1500, run);                       /* Zeit zum Mitlesen */
  const mo=$('.build .readalong'); if(mo) mo.remove();
  await speak([unit()], run);
  if(!isSyl && it.pic){ $('.reward').innerHTML = picHTML(it.pic); await wait(400, run); }
  if(!it.check){ chime(); await wait(600, run); return { misses:0, hinted:false }; }
  /* Kontrolle: Welche Karte ist es? */
  const chk=$('.check');
  chk.innerHTML = it.check.map(t=>`<button class="opt" data-t="${esc(t)}" aria-label="${esc(t)}">${isSyl?`<span class="plain">${esc(t)}</span>`:sylHTML(it.parts.join('')===t?it.parts:splitRead(t))}</button>`).join('');
  const ask = () => [TXT.wo, 120, unit()];
  REPLAY = () => sayBg(ask());
  sayBg(ask());
  let misses=0, hinted=false;
  for(;;){
    const b = await waitTap(x=>x.classList.contains('opt') && !x.disabled && !!x.closest('.check'), run);
    stopSpeech();
    if(b.dataset.t===it.text){
      $$('.check .opt').forEach(x=>{ x.disabled=true; x.classList.remove('hint'); }); const h=$('.hand'); if(h) h.remove();
      b.classList.add('ok'); mark(b,true); chime(); flyStar(b);
      await speak([pick(PRAISE), 150, unit()], run);
      await wait(300, run);
      return { misses, hinted };
    }
    if(hinted) continue;
    /* Nur 2 Karten: die falsche bleibt antippbar, damit „2 Fehler → Hinweis" gilt wie in Level 1 */
    misses++; shake(b); b.classList.add('no'); if(!$('.mark',b)) mark(b,false);
    if(misses>=2){
      hinted=true;
      const ok=$$('.check .opt').find(x=>x.dataset.t===it.text); ok.classList.add('hint');
      ok.insertAdjacentHTML('beforeend','<span class="hand emo">👆</span>');
      $$('.check .opt').forEach(x=>{ if(x!==ok) x.disabled=true; });
      sayBg([TXT.look, 200, unit()]);
    } else sayBg([TXT.again, 200].concat(ask()));
  }
}
function splitRead(t){ for(const m of MODS) for(const r of m.read) if(r.text===t) return r.parts; return [t]; }

const PLAYER = { 1:playL1, 2:playL2, 3:playL3 };

/* ---------- Runde ---------- */
async function runRound(items, run, mi){
  const q=items.slice(); let revHints=0, revTotal=0; const introduced=new Set();
  setPads(q.length);
  for(let i=0;i<q.length;i++){
    const it=q[i]; const kind=it.level+(it.kind||'');
    const out = await PLAYER[it.level](it, { run, mi, intro:!introduced.has(kind) });
    introduced.add(kind);
    guard(run);
    record(it, out);
    if(it.isReview && !it.requeued){ revTotal++; if(out.hinted) revHints++; }
    if(out.hinted && !it.requeued){
      const copy=Object.assign({}, it, { requeued:true, isReview:false });
      prepare(copy, mi, optKey(it)); q.push(copy); addPad();
    }
    fillPad(i);
  }
  return { revHints, revTotal };
}

/* ---------- Intro, Übergänge, Sticker ---------- */
async function stepIntro(mi, run){
  const m=MODS[mi]; setPads(0); REPLAY=null;
  if(m.review){
    view().innerHTML = `<div class="intro">${ICON.frog.replace('class="frog"','class="frog bigfrog"')}<div class="stars">${ICON.star.repeat(3)}</div>
      <button class="go" aria-label="Los">${ICON.play}</button></div>`;
    REPLAY = () => sayBg([TXT.review]);
    await speak([TXT.review], run);
    $('.go').classList.add('ready');
    await waitTap(x=>x.classList.contains('go'), run);
    return;
  }
  const ltile = (l, extra) => { const a=ANCHOR[l]; return `<button class="ltile ${extra||''}" data-l="${l}" aria-label="${LetterPair(l)}"><span class="L">${LetterPair(l)}</span><span class="p">${a?picHTML(a.pic):''}</span></button>`; };
  const top = m.letters.filter(l=>!m.contrast.some(p=>p[0]===l));
  let html = `<div class="intro">` + (top.length?`<div class="letters">${top.map(l=>ltile(l)).join('')}</div>`:'');
  m.contrast.forEach(p=>{ html += `<div class="vs">${ltile(p[0],'c')}${ICON.ear}${ltile(p[1],'c')}</div>`; });
  html += `<button class="go" aria-label="Los">${ICON.play}</button></div>`;
  view().innerHTML = html;
  const tiles=$$('.letters .ltile');
  let seqTok=0;
  const hasTop = tiles.length>0;
  const introSeq = async () => {
    const tok=++seqTok; const alive=()=>tok===seqTok;
    await speak([TXT.newL], run);
    if(!hasTop && !alive()) return;
    for(const t of tiles){ if(!alive()) return; $$('.ltile').forEach(x=>x.classList.remove('lit')); t.classList.add('lit');
      const a=ANCHOR[t.dataset.l]; await speak([LAUT(t.dataset.l), a?W(a):null, 350], run); }
    if(!alive()) return; $$('.ltile').forEach(x=>x.classList.remove('lit'));
    for(const vs of $$('.vs')){
      if(!alive()) return; await speak([TXT.listen, 250], run);
      for(const t of $$('.ltile',vs)){ if(!alive()) return; t.classList.add('lit'); const a=ANCHOR[t.dataset.l];
        await speak([LAUT(t.dataset.l), a?W(a):null, 400], run); t.classList.remove('lit'); }
    }
    const g=$('.go'); if(g && alive()) g.classList.add('ready');
  };
  const runSeq = () => { introSeq().catch(e=>{ if(!(e instanceof Aborted)) console.error(e); }); };
  REPLAY = runSeq; runSeq();
  for(;;){
    const b = await waitTap(x=>x.classList.contains('ltile')||x.classList.contains('go'), run);
    seqTok++;
    if(b.classList.contains('go')) break;
    stopSpeech(); $$('.ltile').forEach(x=>x.classList.remove('lit')); b.classList.add('lit');
    const a=ANCHOR[b.dataset.l]; sayBg([LAUT(b.dataset.l), a?W(a):null]);
    const g=$('.go'); if(g) g.classList.add('ready');
  }
  stopSpeech();
}

/* ---------- Sitzung „Heute" ---------- */
async function runHeute(){
  const run=startRun(); const today=todayStr();
  const sess=planHeute(today);
  show('stage');
  try{
    let lastWasRound=false;
    while(sess.idx < sess.steps.length){
      const step=sess.steps[sess.idx];
      if(step==='intro'){ await stepIntro(sess.m, run); lastWasRound=false; }
      else if(step==='warm'){
        await transition(0, run, TXT.warm);
        await runRound(warmItems(sess.warmFrom), run, sess.m); lastWasRound=true;
      }
      else if(step[0]==='L'){
        const lv=+step[1];
        await transition(lv, run, lastWasRound?TXT.next:TXT.go);
        const r=await runRound(buildRound(sess.m, lv), run, sess.m);
        sess.revHints+=r.revHints; sess.revTotal+=r.revTotal; lastWasRound=true;
      }
      else if(step==='sticker'){ sess.idx++; completeSession(todayStr()); await stepSticker(run); return; }
      else if(step==='done'){ S.session=null; save(); await stepDone(run); break; }
      sess.idx++; if(S.session===sess) save();
    }
  }catch(e){ if(e instanceof Aborted) return; console.error(e); }
  if(run===RUN) goMenu();
}
async function runLevel(level){
  const run=startRun(); show('stage');
  try{
    await transition(level, run, TXT.go);
    await runRound(buildRound(S.cur, level), run, S.cur);
    await stepDone(run);
  }catch(e){ if(e instanceof Aborted) return; console.error(e); }
  if(run===RUN) goMenu();
}

function ttsEntries(){
  const r=[], seen=new Set(); const add=(kind,label,part)=>{ const k=kind+part.id; if(seen.has(k)) return; seen.add(k); r.push({kind,label,part}); };
  MODS.forEach(m=>{ m.syllables.forEach(s=>add('syl',s,SYL(s))); m.read.forEach(rw=>{ rw.parts.forEach(p=>add('syl',p,SYL(p))); add('word',rw.text,{id:idOf(rw.text),t:rw.text}); }); });
  MODS.forEach(m=>m.words.forEach(w=>add('word',`${w.art} ${w.text}`,W(w))));
  Object.values(TXT).concat(PRAISE).forEach(t=>add('phrase',t.t,t));
  return r;
}
function ttsRows(){
  return ttsEntries().map((e,i)=>`<tr data-kind="${e.kind}" data-i="${i}"><td><button data-k="${i}" aria-label="Abspielen">▶</button></td><td>${esc(e.label)}</td><td>${esc(e.part.t||'')}</td><td><code>audio/${esc(e.part.id)}.mp3</code></td><td class="src">${REC[e.part.id]===true?'Aufnahme':REC[e.part.id]===false?'Computerstimme':'–'}</td></tr>`).join('');
}
async function testOne(tr){
  const e=ttsEntries()[+tr.dataset.i]; $$('#ttsTable tr').forEach(x=>x.classList.remove('playing')); tr.classList.add('playing');
  await say([e.part]); tr.classList.remove('playing');
  const src=$('.src',tr); if(src) src.textContent = REC[e.part.id]===true?'Aufnahme':'Computerstimme';
}

/* ========================= Selbstprüfung des Lehrplans ========================= */
function nuclei(s){ return (s.toLowerCase().match(/ei|ai|au|eu|äu|ie|[aeiouäöüy]/g)||[]).length; }
function selfCheck(){
  const R=[]; const ok=(c,t)=>R.push({ok:!!c,t});
  const allWords=MODS.flatMap(m=>m.words.map(w=>Object.assign({mod:m.i},w)));
  /* 1 Artikel */
  allWords.forEach(w=>{ const ref=REFERENCE[w.text];
    ok(['der','die','das'].includes(w.art) && ref && ref.split('|')[0]===w.art, `Artikel „${w.art} ${w.text}"`+(ref?` (Duden: ${ref.split('|')[0]})`:' – nicht im Prüfwörterbuch')); });
  /* 2 Silbentrennung */
  const splits = allWords.map(w=>({text:w.text, parts:w.syl})).concat(MODS.flatMap(m=>m.read.map(r=>({text:r.text,parts:r.parts}))));
  splits.forEach(x=>{ const ref=REFERENCE[x.text]; const mine=x.parts.join('-');
    ok(x.parts.join('')===x.text && x.parts.every(p=>nuclei(p)===1) && ref && ref.split('|')[1]===mine, `Silben ${mine}`+(ref?'':' – nicht im Prüfwörterbuch')); });
  /* 3 Level 3 nur mit gelernten Buchstaben */
  MODS.forEach(m=>{ if(m.review) return; const L=lettersUpTo(m.i);
    m.syllables.concat(m.read.map(r=>r.text)).forEach(t=>{ const bad=[...t.toUpperCase()].filter(ch=>!L.has(ch));
      ok(!bad.length, `Tag ${m.tag}: „${t}" nutzt nur gelernte Buchstaben`+(bad.length?` – fehlt: ${bad.join(',')}`:'')); });
    m.syllables.forEach(s=>ok(/^[BCDFGHJKLMNPQRSTVWXZ][aeiou]$/.test(s), `Tag ${m.tag}: „${s}" ist Konsonant+Vokal`)); });
  /* 4 Anlaut-Verbote + Anlaut gehört zum Tag */
  allWords.forEach(w=>{ const bad=BANNED_ANLAUT.find(b=>w.text.indexOf(b)===0);
    ok(!bad, `Anlaut „${w.text}" nicht verboten`+(bad?` (${bad})`:''));
    ok(MODS[w.mod].letters.includes(w.first), `Tag ${w.mod+1}: „${w.text}" beginnt mit einem neuen Buchstaben des Tages`);
    ok(/^[BCDFGHJKLMNPQRSTVWXZ][aeiouäöü]|^[AEIOU]/.test(w.text), `„${w.text}": kein Konsonanten-Cluster am Anfang`); });
  MODS.forEach(m=>m.read.forEach(r=>{ const bad=BANNED_ANLAUT.find(b=>r.text.indexOf(b)===0); ok(!bad, `Lesewort „${r.text}" ohne verbotenen Anfang`); }));
  /* 5 Verwechselbare Paare: >= 2 Module Abstand + bewusster Kontrast */
  CONFUSABLE.forEach(([a,b])=>{
    const ia=LETTER_MOD[a], ib=LETTER_MOD[b];
    if(ia==null || ib==null){ ok(true, `Paar ${a}/${b}: ${ia==null?a:b} wird nicht eingeführt`); return; }
    const later=Math.max(ia,ib), lm=MODS[later], newL=ia>ib?a:b, oldL=ia>ib?b:a;
    ok(Math.abs(ia-ib)>=2, `Paar ${a}/${b}: Tag ${ia+1} und Tag ${ib+1} (Abstand ${Math.abs(ia-ib)})`);
    ok(lm.contrast.some(p=>p[0]===newL&&p[1]===oldL), `Paar ${a}/${b}: Kontrast an Tag ${later+1} eingetragen`);
  });
  /* 6 Anker + Bilder */
  Object.keys(LETTER_MOD).forEach(l=>ok(!!ANCHOR[l], `Anlaut-Anker für ${l}: ${ANCHOR[l]?ANCHOR[l].text:'fehlt'}`));
  allWords.concat(MODS.flatMap(m=>m.read)).forEach(w=>{ const p=w.pic||''; ok(p && (p.indexOf('svg:')!==0 || PIC[p.slice(4)]), `Bild für „${w.text}"`); });
  MODS.forEach(m=>{ if(!m.review) ok(m.words.length===4, `Tag ${m.tag}: genau 4 Wörter`); });
  ok(MODS.every((m,i)=>((i+1)%5===0)===m.review), 'Jeder 5. Tag ist ein Wiederholungstag');
  /* 7 Rundenzusammensetzung (Simulation mit zufälligen Ergebnissen) */
  const saved=S.items; let fails=0, runs=0; const info=[];
  try{
    const allIds=[]; MODS.forEach(m=>[1,2,3].forEach(lv=>itemsOf(m.i,lv).forEach(it=>allIds.push(it.id))));
    for(let rep=0;rep<60;rep++){
      S.items={}; allIds.forEach(id=>{ if(Math.random()<.5) S.items[id]={seen:(Math.random()*5)|0,misses:(Math.random()*3)|0,hints:(Math.random()*2)|0,last:pick(['ok','miss','hint',''])}; });
      MODS.forEach(m=>[1,2,3].forEach(lv=>{
        const r=buildRound(m.i,lv); runs++;
        const rev=r.filter(x=>x.isReview).length, ids=r.map(x=>x.id);
        const prev=prevContent(m.i);
        let good = r.length===5;
        if(m.review) good = good && rev===5 && r.every(x=>contentBefore(m.i).includes(x.mod)) && new Set(ids).size===5;
        else if(prev<0) good = good && rev===0 && r.every(x=>x.mod===m.i);
        else good = good && rev===1 && r.filter(x=>x.isReview).every(x=>x.mod===prev) && r.filter(x=>!x.isReview).every(x=>x.mod===m.i);
        if(lv===1) good = good && r.every(x=>x.opts.length===3 && new Set(x.opts).size===3 && x.opts.includes(x.target) && x.opts.every(l=>lettersUpTo(m.i).has(l))
            && x.opts.every(l=>l===x.target || !isPair(CONFUSABLE,l,x.target) || x.contrastWith===l));
        if(lv===2) good = good && r.slice(0,-1).every((x,k)=>x.twin || r[k+1].twin || x.w.syl.length<=r[k+1].w.syl.length);
        if(lv===3) good = good && r.every(x=>!x.check || x.check.every(t=>[...t.toUpperCase()].every(ch=>lettersUpTo(m.i).has(ch))));
        const tw=r.find(x=>x.twin); if(tw && lv===1){ const o=r.find(x=>!x.twin&&x.id===tw.id); good = good && optKey(o)!==optKey(tw); }
        if(!good){ fails++; if(info.length<3) info.push(`Tag ${m.tag} L${lv}: ${ids.join(',')}`); }
      }));
    }
    /* verpasstes Item muss als Wiederholung gewählt werden */
    let wfail=0;
    MODS.forEach(m=>{ const pj=prevContent(m.i); if(m.review||pj<0) return;
      [1,2,3].forEach(lv=>{ const pool=itemsOf(pj,lv); const tgt=pick(pool); S.items={}; S.items[tgt.id]={seen:1,misses:2,hints:1,last:'hint'};
        for(let k=0;k<10;k++){ const r=buildRound(m.i,lv); if(!r.some(x=>x.isReview&&x.id===tgt.id)) wfail++; } }); });
    ok(wfail===0, `Verpasste Aufgaben werden zuerst wiederholt (${wfail} Abweichungen)`);
  } finally { S.items=saved; }
  ok(fails===0, `Runden: genau 5 Items, 1 Wiederholung = 20 % (Tag 1: 0, Wiederholungstage: alle) – ${runs} Simulationen, ${fails} Fehler ${info.join(' | ')}`);
  return R;
}
